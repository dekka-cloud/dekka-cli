version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Writes to the terminal have no useful way to fail.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec]
      # A build tool that rewrites the file the Makefile names.
      - path: internal/tools/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dekka-cloud/dekka-cli

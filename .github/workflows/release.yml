name: Release

on:
  push:
    tags: ["v*"]
  # Publishes the npm package for a release that already exists, for when
  # that step failed or the release was made before npm was set up.
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish to npm, such as v0.1.1
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make test
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The npm package fetches the release's archive and checks it against
  # checksums.txt, so the release's own list is published inside the package.
  # The job does nothing until the NPM_TOKEN secret exists, and it can be run
  # again by itself.
  npm:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the npm package
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
          v[0-9]*) version="${TAG#v}" ;;
          *) echo "$TAG is not a release tag" >&2; exit 1 ;;
          esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          cp ../LICENSE .
          npm version --no-git-tag-version "$version"
          # A pre-release must not become what npx dekka installs.
          case "$version" in
          *-*) npm publish --provenance --access public --tag next ;;
          *) npm publish --provenance --access public ;;
          esac

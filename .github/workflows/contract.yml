name: Published contract

# Fails when the API at api.dekka.cloud publishes an OpenAPI document that
# differs from the vendored copy, so the client never drifts unnoticed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make sync-spec
      - name: The vendored document matches the published one
        run: |
          if ! git diff --exit-code --stat -- openapi internal/api; then
            echo "::error::The published API contract has changed. Run make sync-spec and open a pull request."
            exit 1
          fi

version: 2
# Actions are pinned to commit SHAs and images to digests; this keeps them current.
# Each ecosystem's minor and patch updates arrive as one weekly pull request, to spare the CI
# runners. Major versions change behaviour, so they are taken deliberately, one at a time.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]

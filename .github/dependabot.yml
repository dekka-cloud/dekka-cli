version: 2
# Actions are pinned to commit SHAs and images to digests; this keeps them current.
# Each ecosystem's updates arrive as one weekly pull request, to spare the CI runners.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
